# Tier B: the wild corpus.
#
# The PDFs are not in this repository. They are fetched by `cargo xtask corpus fetch`,
# which checks every byte against the SHA-256 below and refuses anything that does not
# match. A corpus whose contents are not pinned is a test that changes under you.
#
# `SOURCES.md` states where each file came from and under what licence. Only files whose
# licence permits local testing are listed; none of them is redistributed by this project.
#
# The field names below are the ones `fixtures/MANIFEST.toml` uses, and `expect` and
# `reader_repairs` mean the same thing in both:
#
#   expect          "valid"    `qpdf --check` exits 0.
#                  "repaired" `qpdf --check` exits 2 or 3: a reader has to tolerate or
#                              rebuild something. `qpdf_verdict` is qpdf's own last line,
#                              kept verbatim, so the classification can be checked rather
#                              than trusted.
#                  "rejected" qpdf cannot open the file at all.
#
#   reader_repairs  whether this reader is expected to have had to rebuild the file's
#                   structure, following `expect`.
#
# Both are claims to be checked by reading the report, not gates. `crates/mangle-render/
# tests/wild_corpus.rs` asserts nothing about any individual file: a corpus test's job is
# to find things, and a hard threshold on a document nobody has read yet turns the first
# unexpected result into a permanent red build.
#
# `fixtures/MANIFEST.toml` has a `text` field listing strings a fixture must contain. This
# manifest deliberately has none: nobody has read these documents, so any expected string
# here would be a guess, and a guessed expectation asserted by a test is worse than none.

# The resolution every comparison in the corpus harness runs at, recorded so a report can
# be read months later without guessing what it was measured against.
dpi = 150


