# Design tokens for ManglePDF.
# Reference mockup: docs/design/reference-mockup.html (1536x1024 logical window).
# Runtime definitions live in crates/mangle-ui/src/theme.rs.

[reference]
mockup = "docs/design/reference-mockup.html"
window_width = 1536
window_height = 1024

[reference.palette]
ink = "#111D39"
muted = "#59637B"
line = "#D9DEEA"
blue = "#365CFF"
pale = "#E8EDFF"
panel = "#F7F8FB"
white = "#FFFFFF"
backdrop = "#E9EBF1"
canvas = "#F0F2F6"
navy_swatch = "#071A3E"

[reference.layout]
topbar_height = 51
toolbar_height = 72
sidebar_width = 222
properties_width = 381
footer_height = 50
thumbnail_width = 132

[light]
window = "#F2F2F2"
chrome = "#E6E6E6"
panel = "#FAFAFA"
canvas = "#B9B9B9"
page = "#FFFFFF"
page_selected = "#E8F0FB"
page_border = "#D0D0D0"
border = "#D6D6D6"
divider = "#DEDEDE"
hover = "#ECECEC"
accent = "#1A6DD6"
text = "#1F1F1F"
text_muted = "#777777"
notice_bg = "#FFF3CD"
notice_text = "#4A3B00"

[dark]
window = "#202020"
chrome = "#2A2A2A"
panel = "#262626"
canvas = "#141414"
page = "#E8E8E8"
page_selected = "#2F3E54"
page_border = "#3A3A3A"
border = "#404040"
divider = "#383838"
hover = "#323232"
accent = "#5A9CF0"
text = "#E6E6E6"
text_muted = "#9A9A9A"
notice_bg = "#4A4018"
notice_text = "#F2E2A8"
